<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor - Weather app</title>

  <link rel="stylesheet" href="styles.css">
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img src="./assets/images/favicon-32x32.png" alt="Weather logo" width="28" height="28">
        <span class="brand-name">Weather Now</span>
      </div>

      <div class="controls">
        <label for="units" class="visually-hidden">Units</label>
        <select id="units" aria-label="Choose units">
          <option value="metric">Metric (°C, km/h, mm)</option>
          <option value="imperial">Imperial (°F, mph, in)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container main-grid">
    <section class="search-section">
      <h1 class="page-title">How's the sky looking today?</h1>

      <form id="search-form" class="search-form" aria-label="Search for a city">
        <label for="q" class="visually-hidden">Search for a city</label>
        <input id="q" name="q" type="search" placeholder="Search for a place, e.g., Tamale, Ghana" required>
        <button type="submit">Search</button>
      </form>

      <div class="weather-card" id="current-card" aria-live="polite">
        <div class="current-left">
          <div class="location" id="current-location">—
            <span id="location-loader" class="location-loader" aria-hidden="true" title="Locating" hidden></span>
          </div>
          <div class="current-date" id="current-date">—</div>
          <div class="current-metrics">
            <div class="temp" id="current-temp">—</div>
            <div class="icon" id="current-icon" aria-hidden="true">☀️</div>
          </div>
        </div>

        <div class="current-right">
          <div class="small-metrics">
            <div><strong>Feels like</strong><div id="feels-like">—</div></div>
            <div><strong>Humidity</strong><div id="humidity">—</div></div>
            <div><strong>Wind</strong><div id="wind">—</div></div>
            <div><strong>Precipitation</strong><div id="precipitation">—</div></div>
          </div>
        </div>
      </div>

      <section class="daily-forecast">
        <h2>Daily forecast</h2>
        <div id="daily" class="daily-grid" role="list">
          <!--to be populated-->
        </div>
      </section>
    </section>

    <aside class="hourly-aside">
      <div class="hourly-header">
        <h2>Hourly forecast</h2>
        <select id="hourly-day-select" aria-label="Select day for hourly forecast"></select>
      </div>

      <div id="hourly" class="hourly-list" role="list">
        <!-- to be populated-->
      </div>
    </aside>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Ayelson</a>.
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
</html>
</body>
</html>
