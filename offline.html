<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline - Weather</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#0b1020;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{max-width:520px;padding:24px;border-radius:12px;background:linear-gradient(180deg,#0f1724,#0b1020);box-shadow:0 10px 30px rgba(0,0,0,0.6);text-align:center}
    h1{margin:0 0 12px;font-size:20px}
    p{margin:0;color:#9aa3b2}
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Some features are unavailable while offline. Previously cached weather data may still be shown in the app.</p>
  </div>
</body>
</html>
